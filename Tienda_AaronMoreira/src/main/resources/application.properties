spring.application.name=Tienda_AaronMoreira

#Para definir el puerto donde escucha el servidor web
server.port=80

#Para definir el formato de despliegue de fecha y hora del log
logging.pattern.dateformat=hh:mm

#Para evitar mensajes invasivos
spring.main.banner-mode=off

#En producción esto es true, en desarrollo es false
spring.thymeleaf.cache=false

# Conexión local a la BD Techshop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techshop

# Usuario y clave de creaTablas.sql
spring.datasource.username=root
spring.datasource.password=Aaron2007

# Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE

#Esta información se utiliza para obtener acceso a su storage.
firebase.bucket.name=tienda-aaronmoreira.firebasestorage.app
firebase.storage.path=Tienda-AaronMoreira
firebase.json.path=firebase
firebase.json.file=tienda-aaronmoreira-firebase-adminsdk-fbsvc-91e03a753e.json





